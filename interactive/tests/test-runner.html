<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Тест · Хімія 10 клас</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="../../icon/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../../icon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../icon/favicon-16x16.png">
<link rel="apple-touch-icon" href="../../icon/apple-touch-icon.png">

<link rel="stylesheet" href="../../components/styles.css">
<link rel="stylesheet" href="../../components/lesson.css">
<link rel="stylesheet" href="test-style.css">

<script src="../../components/components.js" defer></script>
<script src="tests-registry.js" defer></script>
</head>
<body>

<site-header depth="2"></site-header>

<main>
  <div class="breadcrumb">
    <a href="../../index.html">Головна</a><span class="sep">/</span>
    <a href="../interactive.html">Інтерактивна хімія</a><span class="sep">/</span>
    <a href="tests.html">Тести</a><span class="sep">/</span>
    <span class="current" id="breadcrumb-test-title">…</span>
  </div>

  <div class="page-head">
    <div class="eyebrow mono" id="test-eyebrow">Тест</div>
    <h1 style="margin-bottom:8px;" id="test-title">…</h1>
  </div>

  <div class="tq-wrap">

    <div class="tq-result" id="tq-result">
      <div class="tq-score" id="tq-result-score">0 / 0</div>
      <div class="tq-score-label" id="tq-result-label"></div>
      <div class="tq-result-actions">
        <button class="tq-btn-ghost" id="tq-retry">🔁 Спробувати ще раз</button>
        <a href="tests.html" class="tq-btn-ghost">← Усі тести</a>
        <a href="#" class="tq-btn-ghost" id="tq-topic-link" style="display:none;">До теми →</a>
      </div>
    </div>

    <div class="tq-intro">
      <p>Обери відповідь у кожному запитанні, тоді натисни «Перевірити результат».</p>
      <span class="tq-answered" id="tq-answered-count">Відповідено: 0 з …</span>
    </div>

    <div id="tq-questions">
      <!-- Запитання генеруються через test-engine.js на основі файлу тесту -->
    </div>

    <div class="tq-actions">
      <button class="tq-submit-btn" id="tq-submit">Перевірити результат</button>
    </div>
    <p class="tq-submit-hint" id="tq-submit-hint">Можна перевірити тест, навіть якщо відповіли не на всі запитання.</p>

  </div>
</main>

<site-footer depth="2"></site-footer>

<script>
  // Зчитуємо ?test=ID з адреси та підвантажуємо потрібний файл тесту
  const params = new URLSearchParams(window.location.search);
  const testId = params.get('test');

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.onload = resolve;
      script.onerror = reject;
      document.body.appendChild(script);
    });
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const registry = window.TESTS_REGISTRY || [];
    const testInfo = registry.find(t => t.id === testId);

    if (!testInfo) {
      document.getElementById('test-title').textContent = 'Тест не знайдено';
      document.getElementById('breadcrumb-test-title').textContent = 'Тест не знайдено';
      document.getElementById('tq-questions').innerHTML = `
        <p style="color:var(--text-dim);">
          Тест "${testId || '(не вказано)'}" не знайдено в реєстрі.
          <a href="tests.html" style="color:var(--green);">← Повернутись до вибору тесту</a>
        </p>`;
      document.querySelector('.tq-actions').style.display = 'none';
      document.getElementById('tq-submit-hint').style.display = 'none';
      document.querySelector('.tq-intro').style.display = 'none';
      return;
    }

    document.getElementById('page-title').textContent = `${testInfo.title} · Тести · Хімія 10 клас`;
    document.getElementById('test-eyebrow').textContent = `Тест · ${testInfo.icon}`;
    document.getElementById('test-title').textContent = testInfo.title;
    document.getElementById('breadcrumb-test-title').textContent = testInfo.title;

    if (testInfo.topicHref) {
      const topicLink = document.getElementById('tq-topic-link');
      topicLink.href = testInfo.topicHref;
      topicLink.style.display = 'inline-block';
    }

    // Завантажуємо запитання тесту, потім движок (порядок важливий)
    await loadScript(testInfo.file);
    await loadScript('test-engine.js');
  });
</script>

</body>
</html>
